<section id="view-login" class="view-section min-h-screen flex items-center justify-center px-6">
    <div class="glass-card w-full max-w-md p-10 rounded-3xl space-y-8">
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-extrabold text-white tracking-tight">Bon retour parmi nous</h2>
            <p class="text-gray-400">Entrez vos accès pour trader.</p>
        </div>
        
        <form class="space-y-6" (ngSubmit)="onSubmit()">
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Email</label>
                <input type="email" name="email" [(ngModel)]="credentials.email" placeholder="nom@exemple.com" class="input-nexus w-full px-5 py-4 rounded-xl text-sm">
            </div>
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-widest">Mot de passe</label>
                </div>
                <input type="password" name="password" [(ngModel)]="credentials.password" placeholder="••••••••" class="input-nexus w-full px-5 py-4 rounded-xl text-sm">
            </div>
            <button type="submit" class="cursor-pointer btn-gradient w-full py-4 rounded-xl text-black font-bold text-lg mt-4">Se connecter</button>
        </form>

        <p class="text-center text-sm text-gray-400">
            Pas encore de compte ? 
            <button class="text-emerald-400 font-bold hover:underline">S'inscrire</button>
        </p>
    </div>
</section>
